# Builds the Windows installer and publishes a GitHub Release whenever a
# version tag is pushed (e.g. `git tag v1.0.2 && git push origin v1.0.2`).
# The tag must match "version" in package.json.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to, e.g. v4.0.0'
        required: true
      ref:
        description: 'Branch or commit to build (default: the tag itself)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check tag matches package.json version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - run: npm ci

      - name: Build installer
        run: npx electron-builder --win nsis --publish never

      - name: Release notes from CHANGELOG
        shell: bash
        run: node scripts/release-notes.js "${TAG#v}" > release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Booru Suite ${{ env.TAG }}
          body_path: release-notes.md
          files: dist/*.exe
          make_latest: true
